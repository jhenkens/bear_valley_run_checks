runProvider: config
timezone: America/Los_Angeles

# Development flags
enableLoginWithoutPassword: false
disableMagicLink: false

# Optional OpenID Connect sign-in (e.g. Authentik). Enabled when issuer, clientId and
# clientSecret are all set; magic link login always stays available.
oidc:
  issuer: ''        # e.g. https://auth.example.com/application/o/runchecks/
  clientId: ''
  clientSecret: ''
  displayName: Authentik   # Label on the sign-in button
  # Refuse logins whose email_verified claim isn't true. Accounts are matched by email, so only
  # turn this off (OIDC_REQUIRE_VERIFIED_EMAIL=false) if the provider can only release verified emails.
  requireVerifiedEmail: true

# Superusers (always have admin access, cannot be demoted or deleted)
superusers:
  - email: admin@bearvalley.com
    name: Admin User
  - email: patrol@bearvalley.com
    name: Patrol Lead

patrollers: []
runs: []


# Server configuration
databaseUrl: file:./dev.db
sessionSecret: change-this-secret
smtpHost: localhost
smtpPort: 587
smtpUser: ''
smtpPass: ''
emailFrom: noreply@example.com
appUrl: http://localhost:3000
port: 3000
