# Environment variable mappings
# node-config automatically loads these when env vars are set

runProvider: RUN_PROVIDER
databaseUrl: DATABASE_URL
sessionSecret: SESSION_SECRET
smtpHost: SMTP_HOST
smtpPort: SMTP_PORT
smtpUser: SMTP_USER
smtpPass: SMTP_PASS
emailFrom: EMAIL_FROM
appUrl: APP_URL
port: PORT
oidc:
  issuer: OIDC_ISSUER
  clientId: OIDC_CLIENT_ID
  clientSecret: OIDC_CLIENT_SECRET
  displayName: OIDC_NAME
  requireVerifiedEmail:
    __name: OIDC_REQUIRE_VERIFIED_EMAIL
    __format: boolean
board:
  enabled:
    __name: BOARD_ENABLED
    __format: boolean
