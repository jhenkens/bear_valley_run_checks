name: pr-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Compiles the backend and frontend (tsc, webpack) inside the real image, without pushing.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          cache-from: type=gha

  # Merges Dependabot's minor/patch PRs once the build passes. Majors are ignored in
  # dependabot.yml and skipped here too, so they would wait for a human.
  automerge:
    needs: build
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-automerge
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash "$PR_URL"
          # A merge made with GITHUB_TOKEN does not trigger the push workflow, so start it.
          gh workflow run docker-publish.yml --ref main
